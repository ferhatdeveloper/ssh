# =============================================================================
# WebSSH + WGDashboard — Standalone (kendi Caddy ile otomatik TLS)
# =============================================================================
# Bu dosya, Docker Compose ile kendi başına çalıştırmak içindir.
# - Caddy reverse proxy Let's Encrypt ile TLS sağlar
# - Kendi başına çalışır (sunucu IP'sine A kaydı yeterli)
#
# Dokploy kullanıyorsanız bunun yerine docker-compose.dokploy.yaml kullanın.
#
# Kurulum:
#   cp .env.example .env && $EDITOR .env   # WEBSSH_DOMAIN, WGD_DOMAIN ayarla
#   docker compose up -d --build
#
# Erişim:
#   https://ssh.example.com  (Caddy otomatik TLS)
#   https://wgd.example.com
#   UDP <sunucu>:51820       (WireGuard, Caddy yönlendirmez)
# =============================================================================

services:
  webssh:
    build: .
    image: webssh:local
    restart: unless-stopped
    # Caddy üzerinden erişim için doğrudan host portu açmaya gerek yok.
    # Acil durum doğrudan erişim için aşağıdaki satırın yorumunu kaldırın:
    # ports:
    #   - "${WEBSSH_PORT:-3000}:3000"
    environment:
      - PORT=3000
    expose:
      - "3000"
    networks:
      - webssh-internal

  wgdashboard:
    image: ghcr.io/wgdashboard/wgdashboard:latest
    container_name: wgdashboard
    restart: unless-stopped
    hostname: wgdashboard
    # WireGuard UDP portu doğrudan host'a açık kalmalı (Caddy UDP yönlendirmez).
    ports:
      - "51820:51820/udp"
    expose:
      - "10086"
    volumes:
      # WebSSH ile paylaşılan WireGuard yapılandırması.
      - ./wg-conf:/etc/wireguard
      - ./wg-data:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - webssh-internal

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-webssh.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webssh
      - wgdashboard
    networks:
      - webssh-internal

networks:
  webssh-internal:
    name: webssh-internal

volumes:
  wg-conf:
  wg-data:
  caddy_data:
  caddy_config:
