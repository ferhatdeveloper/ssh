# =============================================================================
# WebSSH — DOKPLOY UYUMLU (Sadece SSH Terminal / SFTP)
# =============================================================================
# Bu dosya, Dokploy üzerinde "Docker Compose" tipinde servis oluşturmak içindir.
# Dokploy kendi Traefik reverse proxy'sini yönettiği için burada Caddy YOKTUR.
#
# Sadece WebSSH çalışır (PuTTY benzeri web tabanlı SSH terminali + SFTP).
# WireGuard ve WGDashboard bu sürümde YOKTUR — sadece SSH/SFTP amacıyla
# kullanılan, kendi sunucularınıza girip işlem yapabileceğiniz sade bir
# terminal/SFTP yönetim paneli.
#
# Domain erişimi:
#   https://wssh.retailex.app/   → WebSSH terminali  (port 3000)
#
# Dokploy UI'da yapılacaklar:
#   1) Projects → New → "Docker Compose" tipinde servis oluştur.
#   2) Source → GitHub: ferhatdeveloper/ssh, Branch: main,
#      Compose Path: docker-compose.dokploy.yaml
#   3) Environment sekmesi:
#        PUBLIC_DOMAIN=wssh.retailex.app
#      (Traefik host adı buradan türetilir;
#       ${PUBLIC_DOMAIN} Dokploy label'ları tarafından çözülür)
#   4) Deploy.
#
# Alan adının sunucu IP'sine A (veya AAAA) kaydı çözüyor olması gerekir.
# Traefik + letsencrypt resolver otomatik TLS sağlar.
# =============================================================================

services:

  webssh:
    build: .
    image: webssh:local
    restart: unless-stopped
    # Dokploy uyarısı: container_name KULLANMAYIN (logs/metrics bozulur).
    environment:
      - PORT=3000
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
    expose:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.webssh-app.rule=Host(`${PUBLIC_DOMAIN}`)
      - traefik.http.routers.webssh-app.entrypoints=websecure
      - traefik.http.routers.webssh-app.tls.certresolver=letsencrypt
      - traefik.http.services.webssh-app.loadbalancer.server.port=3000

networks:
  dokploy-network:
    name: dokploy-network
    external: true
