# =============================================================================
# WebSSH + WGDashboard — DOKPLOY UYUMLU
# =============================================================================
# Bu dosya, Dokploy üzerinde "Docker Compose" tipinde servis oluşturmak içindir.
# Dokploy kendi Traefik reverse proxy'sini yönettiği için burada Caddy YOKTUR.
#
# Dokploy UI'da yapılacaklar:
#   1) Projects → New → Docker Compose → Service Name: "webssh"
#   2) Source: "Git Provider" — GitHub hesabını bağla, repo: ferhatdeveloper/ssh
#      Branch: main, Compose Path: docker-compose.dokploy.yaml
#   3) General → "Container Network" kısmına dokunma, kendi oluşturuyor
#      (bu dosya zaten dışarıdan gelen 'dokploy-network' ağına bağlanır)
#   4) Environment sekmesi:
#        WEBSSH_DOMAIN=  ssh.example.com
#        WGD_DOMAIN=     wgd.example.com
#      (Traefik host adı buradan türetilir; Dokploy label'ları ${...} çözümler)
#   5) Domains sekmesi:
#        Host: ssh.example.com  → Service: webssh   → Port: 3000
#        Host: wgd.example.com  → Service: wgdashboard → Port: 10086
#      (Traefik label'lar bu dosyada olduğu için Dokploy "Compose Service" modunda
#       çalıştırır; label'lar compose'dan okunur, bu yüzden Domains sekmesine
#       aslında gerek yok — ama eklemeniz zarar vermez, Dokploy sadece 1
#       tanesini seçer.)
#   6) UDP 51820 portunu host'tan aç:
#        General → "Open Port" → "51820 UDP" — yoksa WireGuard trafiği gelmez.
#   7) Deploy → "Deploy"
#
# Alternatif: Domains sekmesini BOŞ bırakıp yalnızca bu dosyadaki Traefik
# label'larına güvenebilirsiniz. Dokploy bunları okur ve kendi Traefik
# instance'ına ekler. Değişiklik sonrası "Redeploy" gerekir.
# =============================================================================

services:

  webssh:
    build: .
    image: webssh:local
    restart: unless-stopped
    # Dokploy uyarısı: container_name KULLANMAYIN (logs/metrics bozulur).
    environment:
      - PORT=3000
    # Dokploy'un host port yönetimini kendisi yaptığı için expose yeterli.
    expose:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.webssh-ssh.rule=Host(`${WEBSSH_DOMAIN}`)
      - traefik.http.routers.webssh-ssh.entrypoints=websecure
      - traefik.http.routers.webssh-ssh.tls.certresolver=letsencrypt
      - traefik.http.services.webssh-ssh.loadbalancer.server.port=3000
      # WebSocket terminal trafiği — Traefik bunları upgrade etmeli.
      - traefik.http.routers.webssh-ws.rule=Host(`${WEBSSH_DOMAIN}`) && (Path(`/ws`) || PathPrefix(`/ws/`) || Path(`/socket.io`) || PathPrefix(`/socket.io/`))
      - traefik.http.routers.webssh-ws.entrypoints=websecure
      - traefik.http.routers.webssh-ws.tls.certresolver=letsencrypt
      - traefik.http.services.webssh-ws.loadbalancer.server.port=3000

  wgdashboard:
    image: ghcr.io/wgdashboard/wgdashboard:latest
    restart: unless-stopped
    # WireGuard UDP portu host'a doğrudan açık kalmalı (Traefik UDP yönlendirmez).
    ports:
      - "51820:51820/udp"
    expose:
      - "10086"
    volumes:
      - ./wg-conf:/etc/wireguard
      - ./wg-data:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.webssh-wgd.rule=Host(`${WGD_DOMAIN}`)
      - traefik.http.routers.webssh-wgd.entrypoints=websecure
      - traefik.http.routers.webssh-wgd.tls.certresolver=letsencrypt
      - traefik.http.services.webssh-wgd.loadbalancer.server.port=10086

networks:
  dokploy-network:
    name: dokploy-network
    external: true
