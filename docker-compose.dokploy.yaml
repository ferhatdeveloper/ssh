# =============================================================================
# WebSSH — DOKPLOY UYUMLU (Sadece SSH Terminal / SFTP)
# =============================================================================
# Bu dosya, Dokploy üzerinde "Docker Compose" tipinde servis oluşturmak içindir.
#
# Neden Caddy ekledik?
#   Dokploy'un kendi Traefik proxy'si bu kurulumda docker/file provider
#   ile çalışmıyor (sadece entrypoint tanımlı). Bu yüzden biz kendi
#   reverse proxy'mizi (Caddy) kurup domain'i container'a yönlendiriyoruz.
#   Caddy Let's Encrypt'ten otomatik TLS alır.
#
# Domain erişimi:
#   https://wssh.retailex.app/   → WebSSH terminali  (port 3000)
#
# Dokploy UI'da yapılacaklar:
#   1) Projects → New → "Docker Compose" tipinde servis oluştur.
#   2) Source → GitHub: ferhatdeveloper/ssh, Branch: main,
#      Compose Path: docker-compose.dokploy.yaml
#   3) Environment sekmesi:
#        PUBLIC_DOMAIN=wssh.retailex.app
#   4) Domains sekmesinde domain EKLEMEYİN — biz Caddy ile yönlendiriyoruz.
#   5) Deploy.
#
# Alan adının sunucu IP'sine A (veya AAAA) kaydı çözüyor olması gerekir.
# 80 ve 443 portları host'a publish edilir.
# =============================================================================

services:

  webssh:
    build: .
    image: webssh:local
    restart: unless-stopped
    environment:
      - PORT=3000
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
    expose:
      - "3000"
    networks:
      - dokploy-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dokploy-network
    depends_on:
      - webssh

volumes:
  caddy_data:
  caddy_config:

networks:
  dokploy-network:
    name: dokploy-network
    external: true
